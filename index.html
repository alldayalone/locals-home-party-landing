<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>locals. HOME PARTY</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Arial', sans-serif;
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Background video layer */
    .video-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .video-bg-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Layer overlaying the video background */
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Big greyish half-transparent toggle button in the top right */
    .mute-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    .mute-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.05);
    }

    /* Svg icon properties using a flat greyish tint */
    .mute-btn svg {
      width: 32px;
      height: 32px;
      fill: rgba(255, 255, 255, 0.75);
      transition: fill 0.2s;
    }

    /* Typography overlay styling with a 4-second built-in fade-in delay */
    .brand-heading {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 9rem;
      color: #f6c324;
      text-transform: lowercase;
      letter-spacing: -3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.85;
      margin: 0;
      user-select: none;
      text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
      
      /* Animation settings for the 4-second delay */
      opacity: 0;
      animation: fadeInTitle 1.5s ease-out 5s forwards;
    }

    .sub-heading {
      font-family: 'Arial Black', sans-serif;
      font-size: 2.2rem;
      color: #f6c324;
      letter-spacing: 5px;
      margin-top: 15px;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* CSS Keyframes for fading in the title */
    @keyframes fadeInTitle {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .brand-heading { font-size: 5rem; letter-spacing: -1px; }
      .sub-heading { font-size: 1.3rem; letter-spacing: 2px; }
      .mute-btn { width: 54px; height: 54px; top: 16px; right: 16px; }
      .mute-btn svg { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Big round toggle control container -->
    <button id="audioToggle" class="mute-btn" aria-label="Toggle Mute">
      <svg id="audioIcon" viewBox="0 0 24 24">
        <!-- Default path: Volume Off / Muted (Cross version) -->
        <path id="iconPath" d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z" />
      </svg>
    </button>

    <!-- Background video using your file target path -->
    <div class="video-bg-container">
      <video id="bgVideo" autoplay loop muted playsinline>
        <source src="./locals-home-party-20-04-2019.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Typography canvas block -->
    <div class="content-overlay">
      <h1 class="brand-heading">
        locals.
        <span class="sub-heading">HOME PARTY</span>
      </h1>
    </div>

  </div>

  <script>
    const video = document.getElementById('bgVideo');
    const audioBtn = document.getElementById('audioToggle');
    const iconPath = document.getElementById('iconPath');

    // Cleaned up path strings
    const mutedPath = "M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z";
    const unmutedPath = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";

    audioBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      
      // Fixed the toggle assignment logic here
      if (video.muted) {
        iconPath.setAttribute('d', mutedPath);
      } else {
        iconPath.setAttribute('d', unmutedPath);
      }
    });
  </script>

</body>
</html>
